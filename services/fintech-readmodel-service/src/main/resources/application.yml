spring:
  application:
    name: fintech-readmodel-service

  datasource:
    url: jdbc:postgresql://localhost:5432/fintech
    username: fintech_user
    password: fintech_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  kafka:
    bootstrap-servers: kafka:9092
    consumer:
      group-id: readmodel-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: "com.kendry.fintech_readmodel_service.events"

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  metrics:
    tags:
      application: fintech-readmodel-service