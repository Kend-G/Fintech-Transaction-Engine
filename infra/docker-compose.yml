services:

  # -----------------------------
  # PostgreSQL Database
  # -----------------------------
  postgres:
    image: postgres:15
    container_name: fintech_postgres
    environment:
      POSTGRES_DB: fintech
      POSTGRES_USER: fintech_user
      POSTGRES_PASSWORD: fintech_pass
    ports:
      - "5432:5432"
    volumes:
      - fintech_pgdata:/var/lib/postgresql/data
    networks:
      - fintech-net

  # -----------------------------
  # Zookeeper (Kafka dependency)
  # -----------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: fintech_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    networks:
      - fintech-net

  # -----------------------------
  # Kafka Broker
  # -----------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: fintech_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - fintech-net

  # -----------------------------
  # API Service
  # -----------------------------
  api-service:
    build:
      context: ../services/fintech-api-service
      dockerfile: Dockerfile
    container_name: fintech_api_service
    depends_on:
      - postgres
      - kafka
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fintech
      SPRING_DATASOURCE_USERNAME: fintech_user
      SPRING_DATASOURCE_PASSWORD: fintech_pass
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8081:8081"
    networks:
      - fintech-net

  # -----------------------------
  # Ledger Service
  # -----------------------------
  ledger-service:
    build:
      context: ../services/fintech-ledger-service
      dockerfile: Dockerfile
    container_name: fintech_ledger_service
    depends_on:
      - postgres
      - kafka
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fintech
      SPRING_DATASOURCE_USERNAME: fintech_user
      SPRING_DATASOURCE_PASSWORD: fintech_pass
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8082:8082"
    networks:
      - fintech-net

  # -----------------------------
  # Read-Model Service
  # -----------------------------
  readmodel-service:
    build:
      context: ../services/fintech-readmodel-service
      dockerfile: Dockerfile
    container_name: fintech_readmodel_service
    depends_on:
      - postgres
      - kafka
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fintech
      SPRING_DATASOURCE_USERNAME: fintech_user
      SPRING_DATASOURCE_PASSWORD: fintech_pass
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8083:8083"
    networks:
      - fintech-net

  # -----------------------------
  # Prometheus
  # -----------------------------
  prometheus:
    image: prom/prometheus
    container_name: fintech_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - fintech-net

  # -----------------------------
  # Grafana
  # -----------------------------
  grafana:
    image: grafana/grafana
    container_name: fintech_grafana
    ports:
      - "3000:3000"
    networks:
      - fintech-net

networks:
  fintech-net:

volumes:
  fintech_pgdata:
